<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        p {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Đặt lại mật khẩu</h2>
        <form id="resetPasswordForm">
            <input type="hidden" id="token" value="">
            <label for="newPassword">Mật khẩu mới:</label>
            <input type="password" id="newPassword" required>
            <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
            <input type="password" id="confirmPassword" required>
            <button type="submit">Cập nhật mật khẩu</button>
        </form>
        <p id="resetMessage"></p>
    </div>
    <script>
  // Xử lý đặt lại mật khẩu
  $("#resetPasswordForm").on("submit", function(e) {
        e.preventDefault();

        const newPassword = $("#newPassword").val();
        const confirmPassword = $("#confirmPassword").val();
        const token = new URLSearchParams(window.location.search).get("token");

        if (newPassword !== confirmPassword) {
            $("#resetMessage").text("Mật khẩu không khớp.");
            return;
        }

        $.ajax({
            url: `http://localhost:8080/api/taikhoan/reset-password?token=${token}&newPassword=${newPassword}`,
            type: "POST",
            contentType: "application/json",
            success: function(response) {
                $("#resetMessage").text("Mật khẩu đã được cập nhật.");
            },
            error: function(xhr) {
                if (xhr.status === 400) {
                    $("#resetMessage").text("Có lỗi xảy ra. Vui lòng kiểm tra lại thông tin.");
                } else {
                    $("#resetMessage").text("Lỗi: " + xhr.responseText);
                }
            }
        });
    });   
    </script>
</body>

</html>
