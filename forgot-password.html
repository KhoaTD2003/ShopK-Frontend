<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- Thêm jQuery -->

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        p {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Quên mật khẩu</h2>
        <form id="forgotPasswordForm">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
            <button type="submit">Gửi yêu cầu</button>
        </form>
        <p id="message"></p>
    </div>



    <script>
        // Xử lý quên mật khẩu
        $(document).ready(function () {
            $("#forgotPasswordForm").on("submit", function (e) {
                e.preventDefault();

                const email = $("#email").val();

                // Kiểm tra email có được nhập không
                if (!email) {
                    alert('Vui lòng nhập email.');
                    return;
                }
                $.ajax({
                    url: "http://127.0.0.1:8080/api/taikhoan/forgot-password?email="+ encodeURIComponent(email),
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ email: email }),
                    success: function (response) {
                        $("#message").text("Email đặt lại mật khẩu đã được gửi.");
                    },
                    error: function (xhr) {
                        if (xhr.status === 400) {
                            $("#message").text("Có lỗi xảy ra. Vui lòng kiểm tra lại thông tin.");
                        } else {
                            $("#message").text("Lỗi: " + xhr.responseText);
                        }
                    }
                });
            });

            // Xử lý đặt lại mật khẩu
            $("#resetPasswordForm").on("submit", function(e) {
                e.preventDefault();

                const newPassword = $("#newPassword").val();
                const confirmPassword = $("#confirmPassword").val();
                const token = new URLSearchParams(window.location.search).get("token");

                if (newPassword !== confirmPassword) {
                    $("#resetMessage").text("Mật khẩu không khớp.");
                    return;
                }

                $.ajax({
                    url: `http://127.0.0.1:8080/api/taikhoan/reset-password?token=${token}&newPassword=${newPassword}`,
                    type: "POST",
                    contentType: "application/json",
                    success: function(response) {
                        $("#resetMessage").text("Mật khẩu đã được cập nhật.");
                    },
                    error: function(xhr) {
                        if (xhr.status === 400) {
                            $("#resetMessage").text("Có lỗi xảy ra. Vui lòng kiểm tra lại thông tin.");
                        } else {
                            $("#resetMessage").text("Lỗi: " + xhr.responseText);
                        }
                    }
                });
            });
        });

    </script>
</body>

</html>
